name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Portable build and test matrix
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: ./scripts/test.sh

      - name: Compile Release iOS and Mac apps
        run: ./scripts/build.sh

      - name: Build Mac, iPhone, iPad, and Share extension
        run: ./scripts/build-matrix.sh

      - name: Test release paths on iPhone and iPad Simulators
        run: ./scripts/release-matrix-tests.sh

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select PR checks
    runs-on: ubuntu-latest
    outputs:
      mac: ${{ steps.select.outputs.mac }}
      ios: ${{ steps.select.outputs.ios }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check tracked inputs
        run: ./scripts/tracked-input-policy.sh

      - name: Check release history
        run: /usr/bin/ruby scripts/changelog-tests.rb

      - name: Select affected platforms
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            /usr/bin/ruby scripts/ci-changes.rb pr "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "mac=true" >> "$GITHUB_OUTPUT"
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  mac:
    name: Mac and shared tests
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: ./.github/actions/xcode

      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/snip-snap-ci"
          ./scripts/test.sh --mac-only 2>&1 | tee "$RUNNER_TEMP/snip-snap-ci/mac-tests.log"

      - name: Preserve failed test output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-test-output
          path: ${{ runner.temp }}/snip-snap-ci/mac-tests.log
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iOS tests and bundle checks
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: ./.github/actions/xcode

      - name: Install Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Run tests and check app bundles
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/snip-snap-ci"
          ./scripts/test.sh --ios-only 2>&1 | tee "$RUNNER_TEMP/snip-snap-ci/ios-tests.log"

      - name: Preserve failed test output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-output
          path: ${{ runner.temp }}/snip-snap-ci/ios-tests.log
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: Tests and iOS compile check
    needs: [changes, mac, ios]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected test jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MAC_REQUIRED: ${{ needs.changes.outputs.mac }}
          IOS_REQUIRED: ${{ needs.changes.outputs.ios }}
          MAC_RESULT: ${{ needs.mac.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          test "$CHANGES_RESULT" = success
          for platform in MAC IOS; do
            required="${platform}_REQUIRED"
            result="${platform}_RESULT"
            case "${!required}:${!result}" in
              true:success|false:skipped) ;;
              *) exit 1 ;;
            esac
          done

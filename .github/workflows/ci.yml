name: SM33 legacy staged attachment replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    if: github.ref == 'refs/heads/evidence/sm33-legacy-staged-replay-pair'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Check out evidence commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: ./.github/actions/xcode

      - name: Stage once with the historical writer and replay on both readers
        shell: bash
        run: |
          set -euo pipefail
          writer_sha=8e4452bd5bf9b59e0db326a6da08b687b6efdaf5
          writer_production_sha=d49c0ecc9f480692a726d89f861c2c860c95a383
          base_sha=f055bc192f353d4c42928b6be0aefc5a28ebce4a
          candidate_sha=5c712a007ee9bfaafb445536e4bc64f034e68625
          proof_test=Packages/SnipSnapLibrary/Tests/SnipSnapCloudTests/CloudAttachmentTransferTests.swift
          test_filter='CloudAttachmentTransferTests/testObsoletePayloadZoneFailureReplaysFromDiskEvidence$'

          replay_root="$(mktemp -d "$RUNNER_TEMP/sm33-legacy-staged-replay.XXXXXXXX")"
          replay_root="$(cd "$replay_root" && pwd -P)"
          writer_tree="$replay_root/writer"
          base_tree="$replay_root/base"
          candidate_tree="$replay_root/candidate"
          fixture="$replay_root/fixture"
          staged_fixture="$replay_root/staged-fixture"
          reader_patch="$replay_root/reader.patch"

          cleanup() {
            local tree
            for tree in "$writer_tree" "$base_tree" "$candidate_tree"; do
              if [[ -f "$tree/.git" ]]; then
                git worktree remove --force "$tree"
              fi
            done
            rm -rf -- "$replay_root"
          }
          trap cleanup EXIT

          git merge-base --is-ancestor "$writer_sha" "$GITHUB_SHA"
          test "$(git rev-parse "$writer_sha^")" = "$writer_production_sha"
          for sha in "$base_sha" "$candidate_sha"; do
            if ! git cat-file -e "$sha^{commit}"; then
              git fetch --no-tags origin "$sha"
            fi
          done
          git diff --binary "$writer_production_sha..$GITHUB_SHA" -- "$proof_test" > "$reader_patch"
          test -s "$reader_patch"
          git worktree add --detach "$writer_tree" "$writer_sha"
          git worktree add --detach "$base_tree" "$base_sha"
          git worktree add --detach "$candidate_tree" "$candidate_sha"
          test "$(git -C "$writer_tree" rev-parse HEAD)" = "$writer_sha"
          test "$(git -C "$base_tree" rev-parse HEAD)" = "$base_sha"
          test "$(git -C "$candidate_tree" rev-parse HEAD)" = "$candidate_sha"
          test -z "$(git -C "$writer_tree" status --porcelain)"
          for tree in "$base_tree" "$candidate_tree"; do
            git -C "$tree" apply --check "$reader_patch"
            git -C "$tree" apply "$reader_patch"
            test "$(git -C "$tree" diff --name-only)" = "$proof_test"
          done

          run_phase() {
            local label="$1" phase="$2" tree="$3"
            echo "$label source=$(git -C "$tree" rev-parse HEAD)"
            SNIP_SNAP_REPLAY_PHASE="$phase" \
            SNIP_SNAP_REPLAY_ROOT="$fixture" \
            SNIP_SNAP_DIAGNOSTICS_DIRECTORY="$replay_root/diagnostics-$label" \
              swift test --package-path "$tree/Packages/SnipSnapLibrary" \
                --scratch-path "$replay_root/build-$label" --filter "$test_filter" 2>&1 | tee "$replay_root/$label.log"
          }

          mkdir "$fixture"
          echo "writer production=$writer_production_sha"
          run_phase writer stage "$writer_tree"
          grep -q '^SM33-F1-D3 stage .* manifest=saved$' "$replay_root/writer.log"
          writer_raw="$(sed -n 's/^SM33-F1-D3 input .* raw=//p' "$replay_root/writer.log")"
          [[ -n "$writer_raw" && "$writer_raw" != missing ]]
          test -s "$fixture/replay-manifest.json"
          manifest_digest="$(shasum -a 256 "$fixture/replay-manifest.json" | cut -d ' ' -f 1)"
          echo "writer raw=$writer_raw manifestSHA256=$manifest_digest"
          mv "$fixture" "$staged_fixture"

          # The frozen asset URL in the commit points inside the original fixture root.
          failed=0
          for label in base candidate; do
            if [[ "$label" == base ]]; then
              expected=blocked
              tree="$base_tree"
            else
              expected=active
              tree="$candidate_tree"
            fi
            ditto "$staged_fixture" "$fixture"
            diff -qr "$staged_fixture" "$fixture"
            echo "$label input matches the complete staged fixture at the writer's path."
            result=0
            run_phase "$label" "$expected" "$tree" || result=$?
            if [[ "$result" == 0 ]]; then
              grep -Fxq "SM33-LEGACY-STAGED-REPLAY input raw=$writer_raw" "$replay_root/$label.log" || result=$?
              grep -q "^SM33-LEGACY-STAGED-REPLAY replay .* expected=$expected actual=$expected " \
                "$replay_root/$label.log" || result=$?
            fi
            echo "$label replay exit status=$result"
            mv "$fixture" "$replay_root/$label-replayed-fixture"
            if [[ "$result" != 0 ]]; then failed=1; fi
          done
          exit "$failed"

name: SM33-F1-D3 staged attachment replay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    if: github.ref == 'refs/heads/evidence/sm33-f1-d3-replay'
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Check out evidence commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: ./.github/actions/xcode

      - name: Stage once on main and replay on both revisions
        shell: bash
        run: |
          set -euo pipefail
          old_sha=d49c0ecc9f480692a726d89f861c2c860c95a383
          fixed_sha=7dce124e1709f30df4c5a6011c9e6cce98600720
          proof_test=Packages/SnipSnapLibrary/Tests/SnipSnapCloudTests/CloudAttachmentTransferTests.swift
          test_filter='CloudAttachmentTransferTests/testObsoletePayloadZoneFailureReplaysFromDiskEvidence$'

          replay_root="$(mktemp -d "$RUNNER_TEMP/sm33-f1-d3.XXXXXXXX")"
          replay_root="$(cd "$replay_root" && pwd -P)"
          old_tree="$replay_root/old"
          fixed_tree="$replay_root/fixed"
          fixture="$replay_root/fixture"
          staged_copy="$replay_root/staged-copy"
          proof_patch="$replay_root/proof.patch"

          cleanup() {
            local tree
            for tree in "$old_tree" "$fixed_tree"; do
              if [[ -f "$tree/.git" ]]; then
                git worktree remove --force "$tree"
              fi
            done
            rm -rf -- "$replay_root"
          }
          trap cleanup EXIT

          git merge-base --is-ancestor "$old_sha" "$GITHUB_SHA"
          if ! git cat-file -e "$fixed_sha^{commit}"; then
            git fetch --no-tags origin "$fixed_sha"
          fi
          git diff --binary "$old_sha" "$GITHUB_SHA" -- "$proof_test" > "$proof_patch"
          test -s "$proof_patch"
          git worktree add --detach "$old_tree" "$old_sha"
          git worktree add --detach "$fixed_tree" "$fixed_sha"
          for tree in "$old_tree" "$fixed_tree"; do
            git -C "$tree" apply --check "$proof_patch"
            git -C "$tree" apply "$proof_patch"
            test "$(git -C "$tree" diff --name-only)" = "$proof_test"
          done
          test "$(git -C "$old_tree" rev-parse HEAD)" = "$old_sha"
          test "$(git -C "$fixed_tree" rev-parse HEAD)" = "$fixed_sha"

          run_phase() {
            local label="$1" phase="$2" tree="$3" scratch="$4"
            local log="$replay_root/$label.log"
            shift 4
            echo "$label source=$(git -C "$tree" rev-parse HEAD)"
            SNIP_SNAP_REPLAY_PHASE="$phase" \
            SNIP_SNAP_REPLAY_ROOT="$fixture" \
            SNIP_SNAP_DIAGNOSTICS_DIRECTORY="$replay_root/diagnostics-$label" \
              swift test --package-path "$tree/Packages/SnipSnapLibrary" \
                --scratch-path "$scratch" --filter "$test_filter" "$@" 2>&1 | tee "$log" || return
            grep -q "^SM33-F1-D3 $phase " "$log"
          }

          mkdir "$fixture"
          run_phase stage stage "$old_tree" "$replay_root/build-old"
          test -s "$fixture/replay-manifest.json"
          ditto "$fixture" "$staged_copy"
          diff -qr "$fixture" "$staged_copy"
          echo "Old replay input matches the complete staged fixture."

          old_result=0
          run_phase old-replay replay "$old_tree" "$replay_root/build-old" --skip-build || old_result=$?

          # The frozen asset URL in the commit points inside the original fixture root.
          mv "$fixture" "$replay_root/old-replayed-fixture"
          ditto "$staged_copy" "$fixture"
          diff -qr "$staged_copy" "$fixture"
          echo "Fixed replay input matches the same staged fixture at the original path."

          fixed_result=0
          run_phase fixed-replay replay "$fixed_tree" "$replay_root/build-fixed" || fixed_result=$?

          echo "Replay test exit status old=$old_result fixed=$fixed_result"
          [[ "$old_result" == 0 && "$fixed_result" == 0 ]]
